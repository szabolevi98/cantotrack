<!--
    The mark: a clock's ring running round into a tick, white on the brand
    blue. The line is heavier than in the sidebar's drawing, because a tab
    shows it at sixteen pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CantoTrack">
    <rect width="64" height="64" rx="16" fill="#1a5fbf"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 13a19 19 0 1 1-18.1 13.1"/>
        <path d="M24.5 32.5l5.5 5.5 10-11"/>
    </g>
</svg>
